tools:
  act:
    repo: https://github.com/nektos/act
    version: 0.2.89
  astGrep:
    repo: https://github.com/ast-grep/ast-grep
    version: 0.45.1          # tags are NOT v-prefixed; assets are app-<rust-triple>.zip
  awsSso:
    repo: https://github.com/synfinatic/aws-sso-cli
    version: 2.3.2
  bat:
    repo: https://github.com/sharkdp/bat
    version: 0.26.1
  btop:
    repo: https://github.com/aristocratos/btop
    version: 1.4.7           # linux-only tier-1 (no macOS release binary)
  bun:
    repo: https://github.com/oven-sh/bun
    version: 1.3.14          # template adds bun-v prefix; zip holds <name>/bun
  cloudflared:
    repo: https://github.com/cloudflare/cloudflared
    version: 2026.7.3
  eza:
    repo: https://github.com/eza-community/eza
    version: 0.23.5          # linux-only tier-1 (no macOS release binary)
  fd:
    repo: https://github.com/sharkdp/fd
    version: 10.4.2
  fx:
    repo: https://github.com/antonmedv/fx
    version: 39.2.0
  fzf:
    repo: https://github.com/junegunn/fzf
    version: 0.74.2
  gdu:
    repo: https://github.com/dundee/gdu
    version: 5.36.1
  gh:
    repo: https://github.com/cli/cli
    version: 2.97.0
  glow:
    repo: https://github.com/charmbracelet/glow
    version: 2.1.2
  helm:
    repo: https://github.com/helm/helm
    version: 4.2.3
  jq:
    repo: https://github.com/jqlang/jq
    version: jq-1.8.2
  k6:
    repo: https://github.com/grafana/k6
    version: 2.1.0
  k9s:
    repo: https://github.com/derailed/k9s
    version: 0.51.0
  kubectl133:
    repo: https://dl.k8s.io
    version: 1.33.0
  kubectl134:
    repo: https://dl.k8s.io
    version: 1.34.8
  kubectl136:
    repo: https://dl.k8s.io
    version: 1.36.1
  kubetail:
    repo: https://github.com/kubetail-org/kubetail
    version: cli/v0.18.0     # release tag includes the cli/ prefix; assets are kubetail-<os>-<arch>
  mise:
    repo: https://github.com/jdx/mise
    version: 2026.8.2         # version manager (used for Java/JVM); calver, v-prefixed tag
  pack:
    repo: https://github.com/buildpacks/pack
    version: 0.40.8
  ripgrep:
    repo: https://github.com/BurntSushi/ripgrep
    version: 15.2.0
  sd:
    repo: https://github.com/chmln/sd
    version: 1.1.0
  terraform:
    repo: https://github.com/hashicorp/terraform
    version: 1.15.8
  uv:
    repo: https://github.com/astral-sh/uv
    version: 0.12.3
  yq:
    repo: https://github.com/mikefarah/yq
    version: 4.53.3         # yq tags are v-prefixed; template uses .version raw (like jq)
  zoxide:
    repo: https://github.com/ajeetdsouza/zoxide
    version: 0.10.0
